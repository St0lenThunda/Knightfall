name: Warden's Shield (Regression Prevention)

on:
  push:
    branches: [ main, duolingo ]
  pull_request:
    branches: [ main, duolingo ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Provide mock values so the app can boot during testing without real secrets
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || 'https://mock.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY || 'mock-anon-key' }}

jobs:
  # Gate 1: Static Integrity (Type Check)
  integrity:
    name: Structural Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Vue-TSC)
        run: npm run build # This ensures all component props and store refs are valid

      - name: Generate Summary
        run: |
          echo "### 🏛️ Structural Integrity Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All Components & Stores verified." >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Production bundle generated successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **Vite**: Asset tree optimized and linked." >> $GITHUB_STEP_SUMMARY

  # Gate 2: Logic Verification (Unit Tests)
  unit-tests:
    name: Logic Verification
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Generate Summary
        run: |
          echo "### 🧪 Logic Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All Vitest suites passed." >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage**: Core engine math and state transitions verified." >> $GITHUB_STEP_SUMMARY

  # Gate 3: Behavioral Validation (E2E)
  e2e-tests:
    name: Behavioral Validation
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Generate Summary
        run: |
          echo "### 🎭 Behavioral Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ E2E Gameplay & Navigation verified." >> $GITHUB_STEP_SUMMARY
          echo "- **Browsers**: Chromium, Firefox, and Webkit tested successfully." >> $GITHUB_STEP_SUMMARY

  # Gate 4: Production Readiness
  build:
    name: Production Readiness
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Final Production Build
        run: npm run build

      - name: Generate Summary
        run: |
          echo "### 🏁 v0.30.0 Ship-Ready" >> $GITHUB_STEP_SUMMARY
          echo "The Warden has verified all gates. Knightfall is stable and ready for deployment." >> $GITHUB_STEP_SUMMARY
