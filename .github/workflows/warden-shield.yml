name: Warden's Shield (Regression Prevention)

on:
  push:
    branches: [ main, duolingo ]
  pull_request:
    branches: [ main, duolingo ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Provide mock values so the app can boot during testing without real secrets
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || 'https://mock.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY || 'mock-anon-key' }}

jobs:
  # Gate 1: Static Integrity (Type Check)
  integrity:
    name: Structural Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Vue-TSC)
        run: npm run build # This ensures all component props and store refs are valid

  # Gate 2: Logic Verification (Unit Tests)
  unit-tests:
    name: Logic Verification
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --run

  # Gate 3: Behavioral Validation (E2E)
  e2e-tests:
    name: Behavioral Validation
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

  # Gate 4: Production Readiness
  build:
    name: Production Readiness
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Final Production Build
        run: npm run build
