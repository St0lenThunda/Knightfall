name: Warden's Shield (Regression Prevention)

on:
  push:
    branches: [ main, duolingo ]
  pull_request:
    branches: [ main, duolingo ]

jobs:
  # Gate 1: Static Integrity (Linter & Type Check)
  integrity:
    name: Structural Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint
      
      - name: Type Check (Vue-TSC)
        run: npm run build # This ensures all component props and store refs are valid

  # Gate 2: Logic Verification (Unit Tests)
  unit-tests:
    name: Logic Verification
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --run

  # Gate 3: Behavioral Validation (E2E)
  e2e-tests:
    name: Behavioral Validation
    runs-on: ubuntu-latest
    needs: integrity
    # Inject test environment variables at the job level for clearer context access
    env:
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
    # Playwright requires specific environment setup
    container:
      image: mcr.microsoft.com/playwright:v1.41.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Run Playwright Tests
        run: npx playwright test

  # Gate 4: Production Readiness
  build:
    name: Production Readiness
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Final Production Build
        run: npm run build
