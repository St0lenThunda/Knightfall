name: Warden's Shield (Regression Prevention)

on:
  push:
    branches: [ "main", "duolingo" ]
  pull_request:
    branches: [ "main", "duolingo" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true



jobs:
  # Gate 1: Static Integrity (Type Check)
  integrity:
    name: Structural Integrity
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Set Defaults
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=mock-anon-key" >> $GITHUB_ENV; fi
          if [ -z "$VITE_GEMINI_API_KEY" ]; then echo "VITE_GEMINI_API_KEY=mock-gemini-key" >> $GITHUB_ENV; fi
      
      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Vue-TSC)
        run: npm run build # This ensures all component props and store refs are valid

      - name: Generate Summary
        run: |
          echo "### 🏛️ Structural Integrity Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All Components & Stores verified." >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Production bundle generated successfully." >> $GITHUB_STEP_SUMMARY

  # Gate 2: Logic Verification (Unit Tests)
  unit-tests:
    name: Logic Verification
    runs-on: ubuntu-latest
    needs: integrity
    env:
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Set Defaults
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=mock-anon-key" >> $GITHUB_ENV; fi
          if [ -z "$VITE_GEMINI_API_KEY" ]; then echo "VITE_GEMINI_API_KEY=mock-gemini-key" >> $GITHUB_ENV; fi
      
      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Generate Summary
        run: |
          echo "### 🧪 Logic Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All Vitest suites passed." >> $GITHUB_STEP_SUMMARY

  # Gate 3: Behavioral Validation (E2E)
  e2e-tests:
    name: Behavioral Validation
    runs-on: ubuntu-latest
    needs: integrity
    env:
      VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Set Defaults
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=mock-anon-key" >> $GITHUB_ENV; fi
          if [ -z "$VITE_GEMINI_API_KEY" ]; then echo "VITE_GEMINI_API_KEY=mock-gemini-key" >> $GITHUB_ENV; fi
      
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Generate Summary
        run: |
          echo "### 🎭 Behavioral Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ E2E Gameplay & Navigation verified." >> $GITHUB_STEP_SUMMARY

  # Gate 4: AI Intelligence & Readiness
  readiness:
    name: AI Intelligence & Readiness
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff

      - name: Install Fabric
        run: |
          # Install to a local bin directory
          export INSTALL_DIR="$HOME/.local/bin"
          mkdir -p $INSTALL_DIR
          curl -fsSL https://raw.githubusercontent.com/danielmiessler/Fabric/main/scripts/installer/install.sh | bash
          echo "$INSTALL_DIR" >> $GITHUB_PATH
          
      - name: Configure Fabric
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
          TEST_GEMINI_API_KEY_SECRET: ${{ secrets.TEST_GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.config/fabric
          
          # HARDENING: Gemini requires an API key to register as a 'configured' vendor.
          REAL_KEY="${GEMINI_API_KEY_SECRET:-$TEST_GEMINI_API_KEY_SECRET}"
          MOCK_KEY="AIzaSy-MOCK-KEY-FOR-CI-REGISTRATION"
          FINAL_KEY="${REAL_KEY:-$MOCK_KEY}"
          
          echo "GEMINI_API_KEY=$FINAL_KEY" > ~/.config/fabric/.env
          echo "DEFAULT_VENDOR=Gemini" >> ~/.config/fabric/.env
          # Use raw model name without vendor prefix as expected by the internal plugin
          echo "DEFAULT_MODEL=gemini-2.5-flash" >> ~/.config/fabric/.env
          
          # Debug: Verify registration state
          if [ -z "$REAL_KEY" ]; then
            echo "::warning ::TEST_GEMINI_API_KEY is missing. AI Briefing will use mock registration."
          fi

      - name: Generate AI Intelligence Briefing
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
          TEST_GEMINI_API_KEY_SECRET: ${{ secrets.TEST_GEMINI_API_KEY }}
        run: |
          echo "### 🏛️ v0.30.0 Intelligence Briefing" >> $GITHUB_STEP_SUMMARY
          
          # Check if we have a real key before calling the API
          COMBINED_KEY="${GEMINI_API_KEY_SECRET:-$TEST_GEMINI_API_KEY_SECRET}"
          if [[ -z "$COMBINED_KEY" ]]; then
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> **Intelligence Silenced**: Gemini API Key is not configured in repository secrets." >> $GITHUB_STEP_SUMMARY
            echo "> Please add 'GEMINI_API_KEY' or 'TEST_GEMINI_API_KEY' to enable automated change summarization." >> $GITHUB_STEP_SUMMARY
          else
            # Get the changes and summarize. Use '|| true' to prevent job failure if API is down.
            git diff HEAD^ HEAD | fabric --pattern summarize >> $GITHUB_STEP_SUMMARY || echo "*Intelligence Engine unavailable (API Error)*" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "The Warden has verified all gates. Knightfall is stable and ready for deployment." >> $GITHUB_STEP_SUMMARY
